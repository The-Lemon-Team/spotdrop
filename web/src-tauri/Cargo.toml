[package]
name = "spotdrop"
version = "0.1.0"
description = "SpotDrop Desktop Music Player"
authors = ["The Lemon Team"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spotdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tokio = { version = "1.53.3", features = ["full"] }
dirs = "7.0.0"
futures-util = "0.3.34"
url = "2.5.8"
tower = { version = "0.5.3", features = ["util"] }
rfd = "0.17.2"
